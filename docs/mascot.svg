<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="A shield watching network traffic go past">
  <title>AI-Powered IDS</title>

  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b7dd8"/>
      <stop offset="100%" stop-color="#1f4e9c"/>
    </linearGradient>
    <clipPath id="visor">
      <rect x="62" y="86" width="76" height="26" rx="13"/>
    </clipPath>
  </defs>

  <g opacity="0.55">
    <line x1="8" y1="62" x2="192" y2="62" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 7" stroke-linecap="round"/>
    <line x1="8" y1="146" x2="192" y2="146" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 7" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="0" cy="62" r="4" fill="#22c58b">
      <animate attributeName="cx" values="4;196" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="62" r="4" fill="#22c58b" opacity="0.6">
      <animate attributeName="cx" values="4;196" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="146" r="4" fill="#e05a45">
      <animate attributeName="cx" values="196;4" dur="3.1s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M100 22 L162 44 v52 c0 38-26 68-62 82 -36-14-62-44-62-82 V44 Z"
        fill="url(#shield)" stroke="#0f2f63" stroke-width="3" stroke-linejoin="round"/>

  <rect x="62" y="86" width="76" height="26" rx="13" fill="#0b1f3f" opacity="0.92"/>
  <g clip-path="url(#visor)">
    <path d="M58 99 h14 l6-11 7 22 6-16 5 8 h56"
          fill="none" stroke="#22c58b" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 84 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M-26 99 h14 l6-11 7 22 6-16 5 8 h56"
          fill="none" stroke="#22c58b" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 84 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#cfe0f7">
    <circle cx="82" cy="132" r="4.5"/>
    <circle cx="100" cy="132" r="4.5" opacity="0.75"/>
    <circle cx="118" cy="132" r="4.5" opacity="0.5"/>
  </g>

  <line x1="100" y1="22" x2="100" y2="8" stroke="#0f2f63" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="7" r="5" fill="#e05a45">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
