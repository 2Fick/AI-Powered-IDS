<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="A radar sweep over network traffic, most blips benign and a few flagged">
  <title>Sketch A, radar sweep</title>
  <defs>
    <radialGradient id="a-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c58b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22c58b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c58b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22c58b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="110" r="100" fill="#0d1a2e" stroke="#2a3a56" stroke-width="1.5"/>
  <circle cx="110" cy="110" r="100" fill="url(#a-glow)"/>

  <g stroke="#2a3a56" stroke-width="1" fill="none">
    <circle cx="110" cy="110" r="34"/>
    <circle cx="110" cy="110" r="67"/>
    <line x1="10" y1="110" x2="210" y2="110"/>
    <line x1="110" y1="10" x2="110" y2="210"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 110 110" to="360 110 110" dur="4s" repeatCount="indefinite"/>
    <path d="M110 110 L210 110 A100 100 0 0 0 181 40 Z" fill="url(#a-sweep)"/>
    <line x1="110" y1="110" x2="210" y2="110" stroke="#22c58b" stroke-width="2"/>
  </g>

  <g fill="#8fa4c4">
    <circle cx="72" cy="86" r="3"><animate attributeName="opacity" values="0;1;0.2;0" dur="4s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="146" cy="72" r="3"><animate attributeName="opacity" values="0;1;0.2;0" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="92" cy="150" r="3"><animate attributeName="opacity" values="0;1;0.2;0" dur="4s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="158" cy="140" r="3"><animate attributeName="opacity" values="0;1;0.2;0" dur="4s" begin="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="122" r="3"><animate attributeName="opacity" values="0;1;0.2;0" dur="4s" begin="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <circle cx="140" cy="108" r="5" fill="#e05a45">
      <animate attributeName="opacity" values="0;1;1;0.3;0" dur="4s" begin="0.05s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="108" r="5" fill="none" stroke="#e05a45" stroke-width="2">
      <animate attributeName="r" values="5;18" dur="1.2s" begin="0.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.2s" begin="0.05s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="110" cy="110" r="4" fill="#22c58b"/>
</svg>
