<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img" aria-label="The same flow enters three detectors and they return different verdicts">
  <title>Sketch B, three detectors disagree</title>
  <style>
    .lane { font: 600 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #c3d1e8; }
    .note { font: 400 10px system-ui, -apple-system, Segoe UI, sans-serif; fill: #8296b5; }
    .rail { stroke: #2a3a56; stroke-width: 2; fill: none; }
    .tag  { font: 600 11px system-ui, -apple-system, Segoe UI, sans-serif; }
  </style>

  <rect x="0" y="0" width="620" height="200" rx="14" fill="#0d1a2e"/>

  <text class="note" x="22" y="94">one flow</text>
  <path id="b1" class="rail" d="M22 104 H96 V46 H186"/>
  <path id="b2" class="rail" d="M22 104 H186"/>
  <path id="b3" class="rail" d="M22 104 H96 V162 H186"/>

  <circle r="5" fill="#5b91e8">
    <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion>
  </circle>
  <circle r="5" fill="#22c58b">
    <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion>
  </circle>
  <circle r="5" fill="#b07ae0">
    <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#b3"/></animateMotion>
  </circle>

  <g>
    <rect x="186" y="28" width="216" height="36" rx="8" fill="#16233a" stroke="#33456b"/>
    <circle cx="204" cy="46" r="4" fill="#5b91e8"/>
    <text class="lane" x="218" y="50">Random Forest</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.4;0.9;1" dur="2.8s" repeatCount="indefinite"/>
      <rect x="424" y="30" width="158" height="32" rx="16" fill="#12351f" stroke="#1f6b45"/>
      <text class="tag" x="448" y="51" fill="#3ddc97">CAUGHT IT</text>
    </g>
  </g>

  <g>
    <rect x="186" y="86" width="216" height="36" rx="8" fill="#16233a" stroke="#33456b"/>
    <circle cx="204" cy="104" r="4" fill="#22c58b"/>
    <text class="lane" x="218" y="108">Isolation Forest</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.4;0.9;1" dur="2.8s" repeatCount="indefinite"/>
      <rect x="424" y="88" width="158" height="32" rx="16" fill="#3a1a18" stroke="#7c2f26"/>
      <text class="tag" x="448" y="109" fill="#f08d7c">MISSED IT</text>
    </g>
  </g>

  <g>
    <rect x="186" y="144" width="216" height="36" rx="8" fill="#16233a" stroke="#33456b"/>
    <circle cx="204" cy="162" r="4" fill="#b07ae0"/>
    <text class="lane" x="218" y="166">Autoencoder</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.4;0.9;1" dur="2.8s" repeatCount="indefinite"/>
      <rect x="424" y="146" width="158" height="32" rx="16" fill="#12351f" stroke="#1f6b45"/>
      <text class="tag" x="448" y="167" fill="#3ddc97">CAUGHT IT</text>
    </g>
  </g>
</svg>
